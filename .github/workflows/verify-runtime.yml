# On-device verification of the smart-editing UI: real pixels of the four
# smart tools and the transcript on a hardware-accelerated emulator (KVM is
# available on standard GitHub-hosted Linux runners; this public fork runs
# it free). Runs on branch pushes; manual dispatch needs no setup either.
name: Runtime verification

on:
  push:
    branches:
      - smart-editing-features
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK packages
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$SM" --sdk_root="$ANDROID_HOME" "platforms;android-37.1" "build-tools;37.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Fetch the pinned FFmpeg runtime
        run: bash scripts/fetch-ffmpeg-kit-next.sh

      - name: Build the app and the on-device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      # The runner has KVM; the action's auto check can miss it and fall back
      # to software CPU emulation, which the emulator refuses. Give the kvm
      # device to everyone and force hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the smart-editing UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          # Pull the screenshots INSIDE the emulator session: the runner kills
          # the emulator when the script ends, so a later step cannot adb pull.
          # One line: the runner runs each line in its own shell, so a multiline
          # script would lose rc and mask test failures. The debug package is
          # com.cuscus.ffmpeggui.debug.
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.cuscus.ffmpeggui.SmartPanelsScreenshotTest,com.cuscus.ffmpeggui.EditorOpenScreenshotTest,com.cuscus.ffmpeggui.ExportSmokeTest --stacktrace; rc=$?; mkdir -p ci-shots; adb pull /sdcard/Android/data/com.cuscus.ffmpeggui.debug/files/ci-shots/ ci-shots/ || echo "no screenshots pulled (tests may have failed before writing any)"; exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-screenshots
          path: ci-shots/
          retention-days: 5
          if-no-files-found: ignore
