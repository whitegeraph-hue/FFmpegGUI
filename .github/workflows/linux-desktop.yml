name: Linux desktop port
on:
  push:
    branches: [linux-desktop]
    paths: ['desktop/**', 'core/**', '.github/workflows/linux-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Linux media and packaging tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb fakeroot desktop-file-utils fonts-dejavu-core espeak-ng
      - name: Compile unchanged core and native desktop
        run: gradle -p desktop compileKotlin --console=plain
      - name: Run shared core tests
        run: gradle -p desktop :shared-core:test --console=plain
      - name: Generate media fixture
        run: ffmpeg -y -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/linux-input.mp4
      - name: Export using the shared Kotlin CommandBuilder
        run: |
          gradle -p desktop smokeExport -Pinput=/tmp/linux-input.mp4 -Poutput=/tmp/linux-output.mp4 --console=plain
          ffprobe -v error -show_entries format=duration -of json /tmp/linux-output.mp4
          ffmpeg -v error -i /tmp/linux-output.mp4 -f null -
      - name: Test native media workflows
        run: |
          python3 desktop/scripts/make-fixtures.py /tmp/ffmpeggui-fixtures
          gradle -p desktop nativeChecks -PfixtureDir=/tmp/ffmpeggui-fixtures --console=plain
      - name: Test 24MP rotated JPEG with launcher heap
        run: gradle -p desktop largeStillChecks largeHdrChecks --console=plain
      - name: Test original pinned offline models
        run: |
          python3 desktop/scripts/prepare-model-fixtures.py --repo . --output /tmp/ffmpeggui-models
          gradle -p desktop modelChecks -PmodelDir=/tmp/ffmpeggui-models --console=plain
      - name: Inspect native GUI
        run: FFMPEGGUI_OPEN=/tmp/ffmpeggui-fixtures/video.mp4 FFMPEGGUI_SCREENSHOT=/tmp/linux-editor.png xvfb-run -a -s "-screen 0 1440x1000x24" gradle -p desktop run --console=plain
      - name: Package native app with Java runtime
        run: |
          gradle -p desktop packageDeb createDistributable --console=plain
          python3 desktop/scripts/package-deb.py desktop/build/compose/binaries/main/deb/*.deb
      - name: Verify actual extracted Debian launcher
        run: |
          gradle --stop
          mkdir -p /tmp/deb-check
          dpkg-deb -x desktop/build/compose/binaries/main/deb/*.deb /tmp/deb-check
          date -u
          FFMPEGGUI_MODEL_CHECKS=/tmp/ffmpeggui-models /tmp/deb-check/opt/ffmpeggui-linux/bin/ffmpeggui-linux
          FFMPEGGUI_ISOLATED_CHECKS=/tmp/ffmpeggui-models /tmp/deb-check/opt/ffmpeggui-linux/bin/ffmpeggui-linux
          date -u
      - name: Test actual packaged marked dubbing
        run: |
          python3 desktop/scripts/prepare-dub-fixtures.py --output /tmp/ffmpeggui-dub
          FFMPEGGUI_DUB_WORKER_ONLY=1 FFMPEGGUI_DUB_CHECKS=/tmp/ffmpeggui-dub /tmp/deb-check/opt/ffmpeggui-linux/bin/ffmpeggui-linux
      - name: Install Debian package and launch desktop entry
        run: |
          # Remove the runtime first so this step tests Depends resolution.
          sudo apt-get remove -y ffmpeg fonts-dejavu-core espeak-ng
          ! dpkg-query -W -f='${Status}' ffmpeg 2>/dev/null | grep -q 'install ok installed'
          sudo apt-get install -y ./desktop/build/compose/binaries/main/deb/*.deb
          dpkg-query -W ffmpeggui-linux espeak-ng
          FFMPEGGUI_DUB_WORKER_ONLY=1 FFMPEGGUI_DUB_CHECKS=/tmp/ffmpeggui-dub /opt/ffmpeggui-linux/bin/ffmpeggui-linux
          dpkg -V ffmpeggui-linux
          desktop=$(dpkg -L ffmpeggui-linux | grep '/applications/.*[.]desktop$' | head -1)
          test -n "$desktop"
          cat "$desktop"
          desktop-file-validate "$desktop"
          for script in /var/lib/dpkg/info/ffmpeggui-linux.{preinst,postinst,prerm,postrm}; do test ! -f "$script" || sh -n "$script"; done
          FFMPEGGUI_OPEN=/tmp/ffmpeggui-fixtures/video.mp4 FFMPEGGUI_SCREENSHOT=/tmp/installed-editor.png xvfb-run -a -s "-screen 0 1440x1000x24" python3 desktop/scripts/launch-desktop-entry.py "$desktop"
          test -s /tmp/installed-editor.png
          sudo apt-get remove -y ffmpeggui-linux
          test ! -e /opt/ffmpeggui-linux/bin/ffmpeggui-linux
          test ! -e "$desktop"
          sudo apt-get purge -y ffmpeggui-linux
          test ! -e /var/lib/dpkg/info/ffmpeggui-linux.postrm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-desktop-proof
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/app/**
            desktop/shared-core/build/reports/tests/**
            desktop/shared-core/build/test-results/**
            /tmp/linux-output.mp4
            /tmp/linux-editor.png
            /tmp/installed-editor.png
            /tmp/ffmpeggui-dub/isolated.wav
