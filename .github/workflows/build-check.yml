# Builds the app and runs the core tests on every push to the feature branch.
# The sandbox that writes this code cannot finish the full Android build, so
# this job is the check that a revision compiles whole. Standard GitHub-hosted
# runner on a public repository: free, no paid resources.
name: Build check

on:
  push:
    branches:
      - smart-editing-features
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-24.04 runner image already carries the Android SDK at
      # $ANDROID_HOME; install only the packages the build needs (the same
      # ones the media build was verified with).
      - name: Install the Android SDK packages
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$SM" --sdk_root="$ANDROID_HOME" "platforms;android-37.1" "build-tools;37.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The FFmpeg runtime AAR, pinned by URL and SHA-256 (the Gradle build
      # checks the same hash).
      - name: Fetch the pinned FFmpeg runtime
        run: bash scripts/fetch-ffmpeg-kit-next.sh

      - name: Core tests and app build
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      # Kept a few days so a built APK can be fetched after a green run.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 5
